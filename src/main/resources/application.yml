spring:
  application:
    name: maid-booking-system
  profiles:
    active: in-memory

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

---
# ============================================================================
# Profile: in-memory (Default for zero-dependency evaluation & unit tests)
# ============================================================================
spring:
  config:
    activate:
      on-profile: in-memory
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

---
# ============================================================================
# Profile: postgres (Production / Docker Compose with PostgreSQL 16 & HikariCP)
# ============================================================================
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/maid_booking_db}
    username: ${SPRING_DATASOURCE_USERNAME:rupeek_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:rupeek_secret_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: MaidBookingHikariPool
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:25}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:10}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT_MS:2000}
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 15000
      auto-commit: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: Asia/Kolkata
        connection.provider_disables_autocommit: true
  flyway:
    enabled: true
    locations: classpath:db/migration
